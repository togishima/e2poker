services:
  - type: web
    name: e2poker-backend
    runtime: node
    plan: free
    rootDir: .
    buildFilter:
      paths:
        - backend/**
        - shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
    buildCommand: pnpm install
    startCommand: pnpm --filter backend start
    healthCheckPath: /health
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_CONNECTIONS
        value: 200
      - key: MAX_ROOM_CONNECTIONS
        value: 30
      - key: IDLE_TIMEOUT_MS
        value: 1800000

  - type: static
    name: e2poker-frontend
    rootDir: frontend
    buildFilter:
      paths:
        - frontend/**
        - shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
    buildCommand: pnpm install && pnpm --filter frontend build
    staticPublishPath: dist/public
    envVars:
      - key: VITE_WS_URL
        value: wss://e2poker-backend.onrender.com
