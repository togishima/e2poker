<!DOCTYPE html>
<html lang="ja" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E² Poker - Estimate × Ephemeral</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#6366f1',
                            glow: 'rgba(99, 102, 241, 0.3)',
                        }
                    },
                    backgroundImage: {
                        'dotted-dark': 'radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px)',
                        'dotted-light': 'radial-gradient(circle, rgba(0, 0, 0, 0.08) 1px, transparent 1px)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .card-inner {
                @apply relative w-[84px] h-[120px];
                transform-style: preserve-3d;
            }
            .revealed .card-inner {
                animation: flipIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            }
            @keyframes flipIn {
                from { transform: rotateY(0); }
                to { transform: rotateY(180deg); }
            }
            .face {
                @apply absolute inset-0 w-full h-full rounded-2xl flex items-center justify-center font-extrabold;
                backface-visibility: hidden;
                -webkit-backface-visibility: hidden;
            }
            .face-front {
                transform: rotateY(180deg);
            }
            .face-back {
                @apply z-10;
            }
        }
    </style>
</head>

<body
    class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <header
        class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-2 text-xl font-extrabold tracking-tight">
            <span class="bg-primary text-white px-2 py-0.5 rounded-lg text-base">E²</span>
            <span>Poker</span>
        </div>

        <div class="hidden md:flex items-center gap-6 text-sm text-slate-500 dark:text-slate-400 font-medium">
            <div class="font-mono flex items-center gap-2">
                ID: <span id="rId" class="select-all">e8dbdca1-a787...</span>
                <button
                    class="bg-primary hover:bg-indigo-600 text-white px-3 py-1 rounded-md font-bold text-xs shadow-lg shadow-primary/20 transition-all">URL共有</button>
            </div>
            <div>参加者: <b id="cnt" class="text-slate-900 dark:text-white">9</b></div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-4 border-r border-slate-200 dark:border-slate-800 pr-4 mr-2">
                <span class="font-bold text-xs truncate max-w-[100px]" id="userNameDisp">@匿名のキツネ</span>

                <label class="flex items-center gap-2 cursor-pointer select-none group">
                    <span
                        class="text-xs font-bold text-slate-500 group-hover:text-primary transition-colors">観客モード</span>
                    <div class="relative w-9 h-5">
                        <input type="checkbox" id="specMode" class="peer sr-only">
                        <div
                            class="w-full h-full bg-slate-300 dark:bg-slate-700 rounded-full peer-checked:bg-primary transition-colors duration-300">
                        </div>
                        <div
                            class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full transition-transform duration-300 peer-checked:translate-x-4">
                        </div>
                    </div>
                </label>
            </div>

            <div class="relative inline-block" id="themeDropdown">
                <button onclick="toggleThemeMenu(event)"
                    class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-800 px-3 py-1.5 rounded-lg flex items-center gap-2 text-sm font-semibold hover:border-primary transition-all">
                    <span id="current-theme-icon">🌙</span>
                    <span id="current-theme-label">ダーク</span>
                </button>
                <div id="themeMenu"
                    class="absolute top-full right-0 mt-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl p-1 min-w-[140px] hidden opacity-0 translate-y-[-10px] transition-all duration-200 z-[100]">
                    <button onclick="setTheme('system')"
                        class="theme-opt w-full text-left px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 hover:bg-slate-100 dark:hover:bg-slate-700">🖥️
                        システム</button>
                    <button onclick="setTheme('light')"
                        class="theme-opt w-full text-left px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 hover:bg-slate-100 dark:hover:bg-slate-700">☀️
                        ライト</button>
                    <button onclick="setTheme('dark')"
                        class="theme-opt w-full text-left px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 hover:bg-slate-100 dark:hover:bg-slate-700">🌙
                        ダーク</button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center py-8 px-4 overflow-y-auto overflow-x-hidden">
        <div class="h-16 mb-4 flex items-center justify-center">
            <div id="statsRow" class="flex gap-4 invisible opacity-0 transition-opacity duration-300">
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-1.5 rounded-xl shadow-sm flex items-center gap-3 text-xs font-bold">
                    最小 <b id="sMin" class="text-primary text-base">-</b></div>
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-1.5 rounded-xl shadow-sm flex items-center gap-3 text-xs font-bold">
                    平均 <b id="sAvg" class="text-primary text-base">-</b></div>
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-1.5 rounded-xl shadow-sm flex items-center gap-3 text-xs font-bold">
                    最大 <b id="sMax" class="text-primary text-base">-</b></div>
            </div>
        </div>

        <div
            class="table-surface bg-slate-200/40 dark:bg-white/5 border border-slate-300 dark:border-white/10 rounded-[64px] p-8 md:p-12 w-full max-w-5xl flex flex-col items-center gap-10 shadow-2xl backdrop-blur-md relative overflow-hidden transition-colors">
            <!-- Grid Background -->
            <div class="absolute inset-0 opacity-20 pointer-events-none"
                style="background-image: radial-gradient(circle, currentColor 1px, transparent 1px); background-size: 32px 32px;">
            </div>

            <div id="pTable"
                class="grid grid-cols-[repeat(auto-fit,minmax(110px,1fr))] gap-x-2 gap-y-10 w-full max-w-4xl justify-items-center relative z-10">
                <!-- Participants dynamically rendered here -->
            </div>

            <div class="relative z-10 flex flex-col items-center justify-center h-20 w-full mb-4">
                <!-- Buttons share identical border/sizing to prevent layout shift -->
                <button id="revealBtn"
                    class="h-14 bg-primary hover:bg-indigo-600 text-white px-12 rounded-full font-extrabold text-lg shadow-xl shadow-primary/30 transition-all hover:-translate-y-1 active:scale-95 border-2 border-transparent box-border">カードを開く</button>
                <button id="resetBtn"
                    class="hidden h-14 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white px-12 rounded-full font-bold text-sm shadow-md hover:bg-slate-50 transition-all active:scale-95 box-border">次のラウンド</button>
            </div>
        </div>
    </main>

    <footer
        class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-6 flex flex-col items-center gap-6 shadow-xl transition-colors">
        <div class="flex bg-slate-100 dark:bg-slate-950 p-1.5 rounded-2xl gap-2 shadow-inner" id="deckTabs">
            <button onclick="switchDeck('fibonacci')"
                class="tab-btn px-4 py-2 rounded-xl text-xs font-extrabold transition-all duration-300">Fibonacci</button>
            <button onclick="switchDeck('tshirt')"
                class="tab-btn px-4 py-2 rounded-xl text-xs font-extrabold transition-all duration-300">T-Shirt</button>
            <button onclick="switchDeck('fivefinger')"
                class="tab-btn px-4 py-2 rounded-xl text-xs font-extrabold transition-all duration-300">Five
                Finger</button>
        </div>

        <div id="choiceRow" class="flex gap-4 overflow-x-auto pt-6 pb-4 max-w-full justify-center px-4 no-scrollbar">
            <!-- Choice cards dynamically rendered here -->
        </div>
    </footer>

    <script>
        const state = {
            revealed: false,
            currentDeck: 'fibonacci',
            me: { name: 'あなた(あなた)', vote: null, isSpec: false },
            others: [
                { name: '参加者A', vote: '1' },
                { name: '参加者B', vote: '3' },
                { name: 'ペンギン', vote: '5' },
                { name: 'キリン', vote: '8' },
                { name: 'ライオン', vote: '13' },
                { name: 'ゾウ', vote: null },
                { name: 'リス', vote: null, isSpec: true },
                { name: 'カメ', vote: '2' }
            ]
        };

        const decks = {
            fibonacci: ['0', '1', '2', '3', '5', '8', '13', '21', '?'],
            tshirt: ['S', 'M', 'L', 'XL', 'XXL', '?', '☕'],
            fivefinger: ['1', '2', '3', '4', '5', '?', '☕']
        };

        function setTheme(theme) {
            const html = document.documentElement;
            const icon = document.getElementById('current-theme-icon');
            const label = document.getElementById('current-theme-label');
            const opts = document.querySelectorAll('.theme-opt');

            if (theme === 'system') {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                html.classList.toggle('dark', isDark);
            } else {
                html.classList.toggle('dark', theme === 'dark');
            }

            const data = {
                dark: { icon: '🌙', label: 'ダーク' },
                light: { icon: '☀️', label: 'ライト' },
                system: { icon: '🖥️', label: 'システム' }
            };

            icon.textContent = data[theme].icon;
            label.textContent = data[theme].label;

            opts.forEach(opt => {
                const isActive = opt.textContent.includes(data[theme].label);
                opt.classList.toggle('text-primary', isActive);
                opt.classList.toggle('bg-slate-100', isActive);
                opt.classList.toggle('dark:bg-slate-700', isActive);
            });

            closeThemeMenu();
        }

        function toggleThemeMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('themeMenu');
            const isOpen = !menu.classList.contains('hidden');
            if (isOpen) {
                closeThemeMenu();
            } else {
                menu.classList.remove('hidden');
                setTimeout(() => {
                    menu.classList.remove('opacity-0', 'translate-y-[-10px]');
                }, 10);
            }
        }

        function closeThemeMenu() {
            const menu = document.getElementById('themeMenu');
            if (!menu) return;
            menu.classList.add('opacity-0', 'translate-y-[-10px]');
            setTimeout(() => {
                menu.classList.add('hidden');
            }, 200);
        }

        window.onclick = closeThemeMenu;

        function switchDeck(deck) {
            state.currentDeck = deck;
            state.me.vote = null;
            render();
        }

        function render() {
            // Stats
            const statsRow = document.getElementById('statsRow');
            if (statsRow) {
                statsRow.classList.toggle('invisible', !state.revealed);
                statsRow.classList.toggle('opacity-0', !state.revealed);
                statsRow.classList.toggle('opacity-100', state.revealed);
            }

            const allParticipants = [state.me, ...state.others];
            if (state.revealed) {
                const numericalVotes = allParticipants
                    .filter(p => !p.isSpec && p.vote && !isNaN(p.vote))
                    .map(p => parseInt(p.vote));
                if (numericalVotes.length > 0) {
                    if (document.getElementById('sMin')) document.getElementById('sMin').textContent = Math.min(...numericalVotes);
                    if (document.getElementById('sMax')) document.getElementById('sMax').textContent = Math.max(...numericalVotes);
                    if (document.getElementById('sAvg')) document.getElementById('sAvg').textContent = (numericalVotes.reduce((a, b) => a + b, 0) / numericalVotes.length).toFixed(1);
                }
            }

            // Poker Table
            const pTable = document.getElementById('pTable');
            if (pTable) {
                pTable.innerHTML = '';

                allParticipants.forEach(p => {
                    const isMe = p === state.me;
                    const isVoted = !!p.vote;
                    const showCard = state.revealed || (isMe && isVoted);
                    const val = showCard ? p.vote : (isVoted ? '?' : '');

                    const cardHtml = `
                        <div class="flex flex-col items-center gap-3 ${state.revealed ? 'revealed' : ''}">
                            <div class="w-[84px] h-[120px] perspective-[1000px]">
                                <div class="card-inner">
                                    <!-- Back -->
                                    <div class="face face-back bg-white dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700
                                         ${isVoted ? 'bg-indigo-600 !border-solid border-indigo-400 !border shadow-[0_0_20px_rgba(99,102,241,0.4)]' : ''}">
                                        ${isVoted ? '<span class="text-white/20 text-xl italic font-black">E²</span>' : ''}
                                    </div>
                                    <!-- Front -->
                                    <div class="face face-front bg-white text-slate-800 border-2 border-indigo-500 shadow-xl text-3xl font-black">
                                        ${val || ''}
                                    </div>
                                </div>
                            </div>
                            <div class="text-[10px] font-bold text-center ${isMe ? 'text-primary underline underline-offset-4' : 'text-slate-500 dark:text-slate-400'}">
                                ${p.name}${p.isSpec ? '<br><span class="opacity-50 font-medium">(観客)</span>' : ''}
                            </div>
                        </div>
                    `;
                    pTable.insertAdjacentHTML('beforeend', cardHtml);
                });
            }

            // Reveal/Reset Buttons
            if (document.getElementById('revealBtn')) document.getElementById('revealBtn').classList.toggle('hidden', state.revealed);
            if (document.getElementById('resetBtn')) document.getElementById('resetBtn').classList.toggle('hidden', !state.revealed);

            // Tabs
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                const isActive = tab.textContent.toLowerCase().replace(' ', '') === state.currentDeck;
                tab.classList.toggle('bg-white', isActive);
                tab.classList.toggle('dark:bg-slate-800', isActive);
                tab.classList.toggle('text-primary', isActive);
                tab.classList.toggle('shadow-sm', isActive);
                tab.classList.toggle('text-slate-400', !isActive);
            });

            // Choice Row
            const choiceRow = document.getElementById('choiceRow');
            if (choiceRow) {
                choiceRow.innerHTML = '';
                decks[state.currentDeck].forEach(v => {
                    const isSelected = state.me.vote === v;
                    const card = document.createElement('button');
                    card.className = `w-16 h-24 shrink-0 bg-white dark:bg-slate-800 border-2 rounded-2xl flex items-center justify-center text-xl font-black transition-all transform hover:-translate-y-4 hover:shadow-2xl
                        ${isSelected ? 'border-primary bg-primary text-white -translate-y-4 shadow-xl shadow-primary/30' : 'border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white shadow-md'}`;
                    card.textContent = v;
                    card.onclick = () => { if (!state.revealed) { state.me.vote = v; render(); } };
                    choiceRow.appendChild(card);
                });
            }
        }

        document.getElementById('revealBtn').onclick = () => { state.revealed = true; render(); };
        document.getElementById('resetBtn').onclick = () => {
            state.revealed = false;
            state.me.vote = null;
            render();
        };

        document.getElementById('specMode').onchange = (e) => {
            state.me.isSpec = e.target.checked;
            state.me.vote = null;
            render();
        };

        // Initial Theme
        setTheme('dark');
        render();
    </script>
</body>

</html>
